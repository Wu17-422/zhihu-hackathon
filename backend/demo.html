  ⚔️ 犀利评手 · 线上 Demo（复刻知乎界面）

  这一页同时干两件事，别搞混：

  1) 【交作品的公网 Demo】评委不用装扩展，打开链接就能点。
     页面自带全部样式和按钮，右下角 FAB 是五个功能的入口。
  2) 【本地联调的靶子】DOM 结构照着真知乎搭（CommentItem / data-id /
     RichContent / QuestionHeader-title），让扩展抓取走真知乎同一条路径。

  ★ 接口走同源相对路径（API = ""）★
     本地  http://localhost:8000/demo
     线上  https://你的域名/demo
     同一份代码，换域名不用改。

  ★ 结构 ★
     导航栏 → 路由：#/ 推荐  #/hot 热榜  #/discover 发现  #/vip 会员  #/q/<id> 详情
     推荐流和热榜里绝大多数条目是「演示桩」，点开会提示；
     只有 3 条（带 ▶ 标）有真实内容，能跑完整的 AI 分析流程。

  部署见「使用说明.md · 十二、把 Demo 挂到公网」。
-->

  function normalizeStance(s) {
    const t = (s || "").toLowerCase();
    if (/支持|赞成|同意|肯定|正方|agree|pro|support/.test(t)) return "agree";
    if (/反对|驳斥|质疑|否定|反方|唱衰|oppose|con|against/.test(t)) return "oppose";
    return "neutral";
  }
  // cls 必须和 CSS 里的 .zx-stance.agree 对上
  function stanceMeta(s) {
    const n = normalizeStance(s);
    if (n === "agree") return { cls: "agree", ico: "🟢", label: "赞成" };
    if (n === "oppose") return { cls: "oppose", ico: "🔴", label: "反对" };
    return { cls: "neutral", ico: "🟡", label: "中立" };
  }
  function parseFlaw(str) {
    const m = String(str).match(/^([^：:]+)[：:]\s*([\s\S]*)$/);
    return m ? { name: m[1].trim(), desc: m[2].trim() } : { name: String(str), desc: "" };
  }

  function barHtml(stats) {
    if (!stats) return "";
    const agree = stats.agree ? stats.agree.count : 0;
    const oppose = stats.oppose ? stats.oppose.count : 0;
    const neutral = stats.neutral ? stats.neutral.count : 0;
    const total = agree + oppose + neutral;
    if (!total) return "";
    const ap = Math.round((agree / total) * 100), op = Math.round((oppose / total) * 100);
    const np = 100 - ap - op;
    return `<div class="zx-stance-bar">
      <div class="zx-stance-bar-in">
        <div class="zx-stance-seg agree" style="width:${ap}%"></div>
        <div class="zx-stance-seg neutral" style="width:${np}%"></div>
        <div class="zx-stance-seg oppose" style="width:${op}%"></div>
      </div>
      <div class="zx-stance-labels">
        <span>🟢 赞成 ${agree}（${ap}%）</span>
        <span>🟡 中立 ${neutral}（${np}%）</span>
        <span>🔴 反对 ${oppose}（${op}%）</span>
      </div>
    </div>`;
  }

  function relatedHtml(posts) {
    if (!posts || !posts.length) return "";
    return `<div class="zx-related"><div class="zx-related-title">🔗 相关帖子推荐</div>` +
      posts.map((p) => {
        const t = p.url
          ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>`
          : esc(p.title);
        return `<div class="zx-related-item">📄 ${t} <span>— ${esc(p.reason || "")}</span></div>`;
      }).join("") + `</div>`;
  }

  function cardEl(a) {
    const sm = stanceMeta(a.stance);
    const flaws = a.flaws || [];
    const flawsHtml = flaws.length
      ? `<div class="zx-flaws"><div class="zx-flaws-title">⚠ 逻辑漏洞</div>` +
        flaws.map((f) => {
          const p = parseFlaw(f);
          return `<div class="zx-flaw"><span class="zx-flaw-badge">${esc(p.name)}</span><span class="zx-flaw-desc">${esc(p.desc)}</span></div>`;
        }).join("") + `</div>`
      : "";
    const empty = !a.gist && !a.logic;
    const body = empty
      ? `<div class="zx-block-row" style="color:#8590a6">— 未分析 —</div>`
      : `<div class="zx-block"><div class="zx-block-row"><b>想表达什么</b>${esc(a.gist)}</div></div>
         <div class="zx-block"><div class="zx-block-row"><b>推理链</b>${esc(a.logic)}</div></div>${flawsHtml}`;
    const host = document.createElement("div");
    host.className = "zx-host";
    host.innerHTML = `<div class="zx-card"><div class="zx-card-head">
      <span class="zx-ai-chip">AI</span><span class="zx-brand">犀利评手 · 分析</span>
      <span class="zx-stance ${sm.cls}">${sm.ico} ${sm.label}</span></div>${body}</div>`;
    return host;
  }

  function scrapeComments() {
    const out = [], seen = new Set();
    for (const el of document.querySelectorAll(".CommentItem")) {
      const id = el.getAttribute("data-id");
      const textEl = el.querySelector(".CommentItem-text");
      if (!id || !textEl || seen.has(id)) continue;
      seen.add(id);
      const likesEl = el.querySelector(".CommentItem-likeCount");
      out.push({ id, text: textEl.textContent.trim(), likes: likesEl ? parseInt(likesEl.textContent, 10) || 0 : 0 });
    }
    return out;
  }

  async function streamAnalyze(comments, onEvent, model) {
    const qs = model ? "?model=" + encodeURIComponent(model) : "";
    const resp = await fetch(API + "/api/analyze/stream" + qs, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ comments }),
    });
    if (!resp.ok) throw new Error("后端 HTTP " + resp.status);
    if (!resp.body || !resp.body.getReader) throw new Error("这个浏览器读不了流");

    const reader = resp.body.getReader();
    const dec = new TextDecoder("utf-8");
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const raw = buf.slice(0, idx).replace(/\r/g, "");
        buf = buf.slice(idx + 2);
        let name = "message", data = "";
        for (const line of raw.split("\n")) {
          if (line.startsWith("event:")) name = line.slice(6).trim();
          else if (line.startsWith("data:")) data += line.slice(5).trim();
        }
        if (!data) continue;
        let obj; try { obj = JSON.parse(data); } catch (e) { continue; }
        onEvent(name, obj);
      }
    }
  }

  // ── 功能 1：分析评论区 ──
  let analyzing = false;
  async function analyze() {
    if (analyzing) return;
    const comments = scrapeComments();
    if (!comments.length) { toast("这个页面没有可分析的评论"); return; }

    analyzing = true;
    const btn = document.getElementById("zx-act-analyze");
    const old = btn.textContent;
    btn.disabled = true;
    btn.textContent = "分析中…";

    // 立刻把诊断卡亮出来，别让用户盯着空白
    document.querySelectorAll(".zx-host").forEach((n) => n.remove());
    const diag = document.getElementById("zx-diag");
    diag.hidden = false;
    diag.innerHTML = `<div class="zx-diag-head"><span class="zx-ai-chip">AI</span>
        ⚔️ 评论区诊断 <span class="zx-src" id="zx-src">分析中</span></div>
      <div class="zx-core" id="zx-core">正在逐条分析这 ${comments.length} 条评论…</div>
      <div id="zx-stats"></div><div class="zx-progress" id="zx-prog"></div>`;
    const coreEl = diag.querySelector("#zx-core");
    const progEl = diag.querySelector("#zx-prog");
    const srcEl = diag.querySelector("#zx-src");
    const statsEl = diag.querySelector("#zx-stats");
    diag.scrollIntoView({ block: "nearest" });

    const began = Date.now();
    const paint = (msg) => {
      progEl.textContent = `${msg} · 已 ${Math.round((Date.now() - began) / 1000)}s`;
    };
    const timer = setInterval(() => paint(`已分析 ${got} / ${comments.length} 条`), 1000);
    let got = 0;
    paint(`已分析 0 / ${comments.length} 条`);

    const place = (a) => {
      const host = document.querySelector(`.CommentItem[data-id="${CSS.escape(String(a.id))}"]`);
      if (!host || host.querySelector(".zx-host")) return false;
      host.appendChild(cardEl(a));
      return true;
    };

    const onEvent = (name, obj) => {
      if (name === "meta") {
        if (obj.core_dispute) coreEl.textContent = obj.core_dispute;
        paint(`已分析 ${got} / ${comments.length} 条`);
      } else if (name === "analysis") {
        if (place(obj)) got++;
        paint(`已分析 ${got} / ${comments.length} 条`);
      } else if (name === "done") {
        if (obj.core_dispute) coreEl.textContent = obj.core_dispute;
        statsEl.innerHTML = barHtml(obj.stats) + relatedHtml(obj.related_posts);
        const src = obj.source || "";
        srcEl.className = "zx-src " + src;
        srcEl.textContent = src;
        clearInterval(timer);
        progEl.textContent = `✔ 完成 · 共分析 ${got} 条 · 数据来源：${src || "未知"}`;
      } else if (name === "error") {
        clearInterval(timer);
        progEl.innerHTML = `<span style="color:#b91c1c">✕ 分析出错：${esc(obj.message || JSON.stringify(obj))}</span>`;
      }
    };

    try {
      // 首批走快模型：thinking 得把整批「想」完才吐第一条，首屏要干等
      await streamAnalyze(comments, onEvent, "fast");
      if (!got) throw new Error("流结束了但一条结果都没回来");
    } catch (e) {
      clearInterval(timer);
      try {
        progEl.textContent = "流式没接上，退回整批分析…";
        const resp = await fetch(API + "/api/analyze", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ comments }),
        });
        if (!resp.ok) throw new Error("后端 HTTP " + resp.status);
        const data = await resp.json();
        for (const a of data.analyses || []) { if (place(a)) got++; }
        coreEl.textContent = data.core_dispute || coreEl.textContent;
        statsEl.innerHTML = barHtml(data.stats) + relatedHtml(data.related_posts);
        srcEl.className = "zx-src " + (data._source || "");
        srcEl.textContent = data._source || "";
        progEl.textContent = `✔ 完成（整批回退）· 共 ${got} 条 · 数据来源：${data._source || "未知"}`
          + (data._error ? ` · 降级原因：${data._error}` : "");
      } catch (e2) {
        progEl.innerHTML = `<span style="color:#b91c1c">✕ 出错：${esc(e2.message)}</span><br>
          <span style="color:#8590a6">本地请确认后端已启动（start.bat）；线上请稍后重试。</span>`;
      }
    } finally {
      clearInterval(timer);
      analyzing = false;
      btn.disabled = false;
      btn.textContent = old;
    }
  }

  /* ── 抽屉通用 ── */
  let drawerEl = null, maskEl = null;
  function openDrawer(html) {
    closeDrawer();
    maskEl = document.createElement("div");
    maskEl.className = "zx-drawer-mask";
    maskEl.onclick = closeDrawer;
    drawerEl = document.createElement("div");
    drawerEl.className = "zx-drawer";
    drawerEl.innerHTML = html;
    document.body.appendChild(maskEl);
    document.body.appendChild(drawerEl);
    const c = drawerEl.querySelector(".zr-close");
    if (c) c.onclick = closeDrawer;
    return drawerEl;
  }
  function closeDrawer() {
    if (drawerEl) { drawerEl.remove(); drawerEl = null; }
    if (maskEl) { maskEl.remove(); maskEl = null; }
  }

  /* ── 功能 2：思维导图（真树 + 连接线） ── */
  function treeHtml(node, depth) {
    const kids = node && node.children ? node.children : [];
    const cls = depth === 0 ? "root" : depth === 1 ? "l1" : "";
    const label = `<span class="zx-node ${cls}">${esc(node && node.name ? node.name : "")}</span>`;
    if (!kids.length) return `<li>${label}</li>`;
    return `<li>${label}<ul>${kids.map((c) => treeHtml(c, depth + 1)).join("")}</ul></li>`;
  }

  async function mindmap() {
    const richEl = document.querySelector(".RichContent");
    const content = richEl ? richEl.textContent.replace(/\s+/g, " ").trim().slice(0, 3000) : "";
    const titleEl = document.querySelector(".QuestionHeader-title");
    const title = titleEl ? titleEl.textContent.trim() : "";
    if (!content) { toast("这个页面没识别到正文"); return; }

    const d = openDrawer(`<div class="zr-head">🧠 思维导图 <button class="zr-close">✕</button></div>
      <div class="zr-count">${esc(title)}</div>
      <div class="zr-count" id="zx-mm-prog">正在把正文拆成结构…</div>
      <div class="zx-tree" id="zx-mm-body" style="color:#8590a6"></div>`);
    const prog = d.querySelector("#zx-mm-prog");
    const body = d.querySelector("#zx-mm-body");
    const began = Date.now();
    const timer = setInterval(() => {
      prog.textContent = `正在把正文拆成结构… 已 ${Math.round((Date.now() - began) / 1000)}s`;
    }, 1000);

    try {
      const resp = await fetch(API + "/api/mindmap", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, content }),
      });
      if (!resp.ok) throw new Error("后端 HTTP " + resp.status);
      const data = await resp.json();
      clearInterval(timer);
      prog.innerHTML = `数据来源：${esc(data._source || "未知")}`
        + (data._error ? ` · <span style="color:#b91c1c">降级原因：${esc(data._error)}</span>` : "");
      body.style.color = "";
      body.innerHTML = data.mindmap
        ? `<ul>${treeHtml(data.mindmap, 0)}</ul>`
        : `<span style="color:#8590a6">没有拿到导图数据</span>`;
    } catch (e) {
      clearInterval(timer);
      prog.innerHTML = `<span style="color:#b91c1c">✕ 出错：${esc(e.message)}</span>`;
    }
  }

  /* ── 功能 3：写评论实时润色 ── */
  let polishTimer = null;
  function polishDrawer(prefill) {
    const d = openDrawer(`<div class="zr-head">✍️ 写评论 · 实时检测 <button class="zr-close">✕</button></div>
      <textarea class="zr-draft" placeholder="在这里写你的评论…&#10;停 1.5 秒，AI 会自动挑出逻辑漏洞并给一版改好的。">${esc(prefill || "")}</textarea>
      <div class="zr-bar"><label><input type="checkbox" id="zx-realtime" checked> 实时检测</label>
        <span>停顿 1.5 秒自动分析</span></div>
      <div id="zx-polish-out" style="color:#8590a6">输入评论，AI 会挑出逻辑漏洞并给一版改好的。</div>`);
    const ta = d.querySelector(".zr-draft");
    ta.addEventListener("input", () => {
      if (!d.querySelector("#zx-realtime").checked) return;
      clearTimeout(polishTimer);
      polishTimer = setTimeout(() => runPolish(d), 1500);
    });
    d.querySelector("#zx-realtime").addEventListener("change", (e) => {
      if (e.target.checked && ta.value.trim()) runPolish(d);
    });
    ta.focus();
    if (prefill && prefill.trim()) runPolish(d);
  }

  async function runPolish(d) {
    const ta = d.querySelector(".zr-draft");
    const out = d.querySelector("#zx-polish-out");
    const draft = (ta.value || "").trim();
    if (!draft) { out.style.color = "#8590a6"; out.textContent = "输入评论，AI 会挑出逻辑漏洞并给一版改好的。"; return; }
    out.style.color = "";
    out.textContent = "检测中…";
    try {
      const resp = await fetch(API + "/api/polish", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ draft }),
      });
      if (!resp.ok) throw new Error("后端 HTTP " + resp.status);
      const data = await resp.json();
      const flaws = (data.flaws || []).map((f) => `<div class="zr-p-flaw">
        <div class="zr-pf-name">⚠ ${esc(f.name)}</div>
        <div class="zr-pf-claim">问题点：${esc(f.claim)}</div>
        <div class="zr-pf-why">原因：${esc(f.why)}</div></div>`).join("");
      out.innerHTML = `<div class="zr-verdict"><b>判断：</b>${esc(data.verdict)}</div>${flaws}
        <div class="zr-p-rewrite"><b>✨ 改好的版本</b><button class="zr-copy">复制</button><br>${esc(data.rewrite)}</div>`;
      const cp = out.querySelector(".zr-copy");
      if (cp) cp.onclick = () => {
        navigator.clipboard.writeText(data.rewrite || "").then(
          () => { cp.textContent = "已复制"; }, () => { cp.textContent = "复制失败"; });
      };
    } catch (e) {
      out.innerHTML = `<span style="color:#b91c1c">✕ 分析失败：${esc(e.message)}</span>`;
    }
  }

  /* ── 功能 4：知乎故事 / 知识 ── */
  async function stories() {
    const d = openDrawer(`<div class="zr-head">📚 知乎故事 / 知识 <button class="zr-close">✕</button></div>
      <div class="zr-count" id="zx-st-prog">加载中…</div><div id="zx-st-list"></div>`);
    const prog = d.querySelector("#zx-st-prog");
    const list = d.querySelector("#zx-st-list");
    try {
      const [s, k] = await Promise.all([
        fetch(API + "/api/stories").then((r) => r.json()),
        fetch(API + "/api/knowledge").then((r) => r.json()),
      ]);
      const pick = (x) => (x && (x.data || x.items)) || [];
      const sItems = Array.isArray(pick(s)) ? pick(s) : [];
      const kItems = Array.isArray(pick(k)) ? pick(k) : [];
      if (!sItems.length && !kItems.length) {
        prog.innerHTML = `<span style="color:#b91c1c">✕ 没拿到数据</span>`
          + (s && s.error ? ` · ${esc(s.error)}` : (k && k.error ? ` · ${esc(k.error)}` : ""));
        return;
      }
      prog.textContent = `知乎故事 ${sItems.length} 条 · 知乎知识 ${kItems.length} 条`;
      const row = (it) => `<div class="zr-item" data-wid="${esc(it.work_id || it.id || "")}">
        <div class="zr-item-t">${esc(it.title || "")}</div>
        <div class="zr-item-d">${esc(it.description || it.introduction || "")}</div></div>`;
      list.innerHTML = (sItems.length ? `<div class="zr-count" style="margin-top:10px">📖 知乎故事</div>` + sItems.map(row).join("") : "")
        + (kItems.length ? `<div class="zr-count" style="margin-top:14px">📚 知乎知识</div>` + kItems.map(row).join("") : "");
      list.querySelectorAll("[data-wid]").forEach((el) => {
        el.onclick = () => openStory(d, el.getAttribute("data-wid"));
      });
    } catch (e) {
      prog.innerHTML = `<span style="color:#b91c1c">✕ 出错：${esc(e.message)}</span>`;
    }
  }

  async function openStory(d, wid) {
    if (!wid) return;
    const list = d.querySelector("#zx-st-list");
    const prog = d.querySelector("#zx-st-prog");
    list.style.display = "none";
    prog.textContent = "加载中…";
    try {
      const item = await (await fetch(API + "/api/story/" + encodeURIComponent(wid))).json();
      const it = (item && (item.data || item)) || {};
      const content = it.content || it.introduction || "";
      d.querySelector(".zx-drawer, .zr-head");
      const head = d.querySelector(".zr-head");
      head.innerHTML = `📖 ${esc(it.chapter_name || it.title || "详情")} <button class="zr-close">✕</button>`;
      head.querySelector(".zr-close").onclick = closeDrawer;
      prog.innerHTML = it.author_name ? `作者：${esc(it.author_name)}` : "";
      list.style.display = "";
      list.innerHTML = `<div style="background:#fafafa;border-radius:8px;padding:12px;line-height:1.8;
          max-height:45vh;overflow:auto">${esc(content)}</div>
        <button class="zh-btn-blue" id="zx-st-mm" style="background:#00897b;margin-top:12px">🧠 生成思维导图</button>`;
      list.querySelector("#zx-st-mm").onclick = async (e) => {
        const b = e.target;
        b.disabled = true; b.textContent = "生成中…";
        try {
          const resp = await fetch(API + "/api/mindmap", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title: it.chapter_name || it.title || "", content }),
          });
          const data = await resp.json();
          list.querySelector("#zx-st-mm").insertAdjacentHTML("afterend",
            `<div class="zx-tree" style="margin-top:10px">${data.mindmap ? `<ul>${treeHtml(data.mindmap, 0)}</ul>` : "没有导图数据"}</div>`);
          b.remove();
        } catch (err) {
          b.disabled = false; b.textContent = "🧠 生成思维导图";
          prog.innerHTML = `<span style="color:#b91c1c">✕ 出错：${esc(err.message)}</span>`;
        }
      };
    } catch (e) {
      list.style.display = "";
      prog.innerHTML = `<span style="color:#b91c1c">✕ 出错：${esc(e.message)}</span>`;
    }
  }

  /* ═══════════ 启动 ═══════════ */
  document.getElementById("zx-fab-main").onclick = () => {
    document.getElementById("zx-fab").classList.toggle("open");
  };
  document.getElementById("zx-act-analyze").onclick = () => {
    document.getElementById("zx-fab").classList.remove("open");
    analyze();
  };
  document.getElementById("zx-act-mindmap").onclick = () => {
    document.getElementById("zx-fab").classList.remove("open");
    mindmap();
  };
  document.getElementById("zx-act-polish").onclick = () => {
    document.getElementById("zx-fab").classList.remove("open");
    polishDrawer("");
  };
  document.getElementById("zx-act-story").onclick = () => {
    document.getElementById("zx-fab").classList.remove("open");
    stories();
  };
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      closeDrawer();
      document.getElementById("zx-fab").classList.remove("open");
    }
  });

  route();
  // 从别的页面带着 hash 进来时兜底
  if (!location.hash) location.replace("#/");
})();
</script>
</body>
